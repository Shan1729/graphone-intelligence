[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "graphone-intelligence"
version = "0.1.0"
description = "GraphOne Intelligence Platform"
requires-python = ">=3.10"
dependencies = [
    "httpx",
    "google-genai",
]


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "tests",
]